[workspace]
resolver = "3"
members = ["crates/*"]
# CI canaries are standalone workspaces that must never join the real build.
exclude = ["ci"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
