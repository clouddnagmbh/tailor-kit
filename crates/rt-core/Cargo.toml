[package]
name = "rt-core"
description = "RequestTailor: HTTP engine, variables, auth and runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true


[dependencies]
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
# AWS Signature V4 (wave 5, strand D): pure Rust, builds on every target.
hmac = "0.12"
# OAuth 2.0 (wave 5, strand C): PKCE verifier and state from the OS random source; the S256
# challenge uses sha2 (below). MIT OR Apache-2.0, pure Rust.
getrandom = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
# Companion protocol (strand G): the `x-rt-head` header and the `/v1/send` envelope.
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
# std::time::Instant panics on wasm32-unknown-unknown; web-time works on every target.
web-time = "1"

# Transport (strand A), native: own HTTP/1.1 + HTTP/2 stack, rustls with ring (no aws-lc),
# OS trust store via rustls-platform-verifier.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["net", "time", "rt"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3"
# Client certificates (strand D, wave 5): PKCS#12 archives and encrypted PKCS#8 keys.
p12-keystore = "0.4"
pkcs8 = { version = "0.11", features = ["encryption", "pem", "std"] }

# Transport (strand A), browser: fetch via web-sys.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's crypto.getRandomValues for getrandom (OAuth 2.0 PKCE and state).
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "DomException",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "RequestInit",
  "RequestRedirect",
  "Response",
  "ResponseType",
  "Url",
] }

[dev-dependencies]
serde_json = "1"

# Transport tests (strand A): in-process test server, local TLS + HTTP/2 server.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
rt-testserver = { path = "../rt-testserver" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[lints]
workspace = true
