[package]
name = "rt-core"
description = "RequestTailor: HTTP engine, variables, auth and runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true


[dependencies]
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
url = "2"
# std::time::Instant panics on wasm32-unknown-unknown; web-time works on every target.
web-time = "1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
