[package]
name = "rt-git"
description = "RequestTailor: Git for collections on native targets (the Tailor Kit's tk-git with RequestTailor's parts)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Native only (desktop, CLI, iOS check), like tk-git. The web app runs Git in JavaScript
# (isomorphic-git). Excluded from the wasm32 build.

[dependencies]
rt-app = { path = "../rt-app" }
# The Git core; re-exported whole, with RequestTailor's profile as the default of `Options`.
tk-git = { path = "../tk-git" }
tk-git-types = { path = "../tk-git-types" }

[dev-dependencies]
# Bare test remotes and looking into them.
gix = { version = "0.90", default-features = false, features = ["sha1"] }
# Wave 12, strand B: reading merged collections in the semantic merge tests.
rt-core = { path = "../rt-core" }
rt-format = { path = "../rt-format" }
# Plan fixtures of the wizard tests, the JSON lines of the perf examples.
serde_json = "1"

[lints]
workspace = true
